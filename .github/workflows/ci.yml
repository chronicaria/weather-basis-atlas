name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      # V2 fixture boundaries: strict schemas, frozen support/contract registry,
      # and seal/tamper/recovery behavior.  These checks never fetch weather or
      # execute a national numerical stage.
      - run: uv run pytest tests/unit/test_v2_schemas.py tests/unit/test_v2_registry.py tests/unit/test_v2_release.py
      - run: uv run pytest
      - run: uv run wba reproduce --fixture --out /tmp/wba-fixture
      - run: uv run wba site check --fixture --site /tmp/wba-fixture/site
