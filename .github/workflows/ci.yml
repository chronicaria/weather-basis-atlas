name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run wba reproduce --fixture --out /tmp/wba-fixture
      - run: uv run wba site check --fixture --site /tmp/wba-fixture/site
